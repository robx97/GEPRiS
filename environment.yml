name: gepris

channels:
  - conda-forge

dependencies:
  # Python 3.9 balances modern package support while running on older macOS targets
  - python=3.11

  # Core scientific stack
  - numpy>=1.26,<3
  - scipy>=1.12
  - pandas>=2.2
  - matplotlib>=3.8

  # ROOT with PyROOT pinned safely for older macOS kernels
  - root>=6.34.*
  - uproot>=5.3

  # Minimiser used in fitter.py
  - iminuit>=2.3

  # Jupyter for running run_fit.ipynb
  - jupyterlab>=4
  - ipykernel

  # Array backend handling
  - awkward>=2.6

# ── Clean-Up Verification Checklist ──────────────────────────────────────────
# 1. Before creating this environment, clean your directory of old bytecode:
#    find . -name "__pycache__" -delete
# 2. Force conda to respect the environment file's channel choices:
#    conda env create -f environment.yml --override-channels
